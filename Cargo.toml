[package]
name = "alloy-lbfgsb"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Standalone callback-first L-BFGS-B solver"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/adam-t-burke/alloy-lbfgsb"
homepage = "https://github.com/adam-t-burke/alloy-lbfgsb"
documentation = "https://docs.rs/alloy-lbfgsb"
keywords = ["optimization", "lbfgsb", "numerical", "solver"]
categories = ["algorithms", "mathematics", "science"]
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "tests/reference/**/*",
    "benches/**/*.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "UPSTREAM_LICENSE.txt",
    "THIRD_PARTY_NOTICES.md",
    "BENCHMARKS.md",
    "docs/**/*.md",
    "CHANGELOG.md",
]

[features]
benchmark-instrumentation = []
faer-backend = ["dep:faer-core"]

[dependencies]
faer-core = { version = "0.17", optional = true }

[[bench]]
name = "performance"
harness = false


# Match the build settings used by the inherited performance baseline.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
